<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Name Here</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0616;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  canvas {
    display: block;
  }

  .hero {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    padding: 2rem;
  }

  .hero h1 {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-shadow: 0 0 30px rgba(255, 190, 120, 0.35), 0 0 80px rgba(140, 90, 255, 0.25);
  }

  .hero p {
    margin-top: 1.25rem;
    font-size: clamp(1rem, 2vw, 1.4rem);
    letter-spacing: 0.35em;
    opacity: 0.75;
  }

  .cta {
    margin-top: 2.5rem;
    pointer-events: auto;
    display: inline-block;
    padding: 0.9rem 2.6rem;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-size: 1rem;
    letter-spacing: 0.12em;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(4px);
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .cta:hover {
    background: rgba(160, 100, 255, 0.28);
    border-color: rgba(180, 130, 255, 0.9);
    box-shadow: 0 0 24px rgba(150, 90, 255, 0.5);
    transform: translateY(-2px);
  }

  .hint {
    position: fixed;
    bottom: 1.25rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    opacity: 0.4;
    z-index: 2;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<section class="hero">
  <h1>Your Name Here</h1>
  <p>Design &middot; Code &middot; Create</p>
  <a class="cta" href="#">View my work</a>
</section>

<div class="hint">Drag to orbit &middot; Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const container = document.getElementById('canvas-container');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0616);

  const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
  );
  camera.position.set(0, 22, 55);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = false;
  controls.minDistance = 8;
  controls.maxDistance = 200;

  const COUNT = 50000;

  const positions = new Float32Array(COUNT * 3);
  const colors = new Float32Array(COUNT * 3);

  const coreColor = new THREE.Color(0xffb057);
  const midColor  = new THREE.Color(0xc96fff);
  const rimColor  = new THREE.Color(0x8a2be2);

  const tempColor = new THREE.Color();

  const ARMS = 4;
  const SPIRAL_TIGHTNESS = 3.5;
  const MAX_RADIUS = 24;

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;

    const r = Math.pow(Math.random(), 1.6) * MAX_RADIUS;

    const armIndex = Math.floor(Math.random() * ARMS);
    const angleOffset = (Math.PI * 2 * armIndex) / ARMS;
    const spread = 0.35 + r * 0.04;
    const angle =
      angleOffset +
      (r / MAX_RADIUS) * SPIRAL_TIGHTNESS +
      (Math.random() - 0.5) * spread;

    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;

    const discThickness = 0.4 + r * 0.12;
    let y = (Math.random() - 0.5) * discThickness;

    if (r < 3) {
      y = (Math.random() - 0.5) * 1.8 * (1 - r / 3);
    }

    positions[i3]     = x;
    positions[i3 + 1] = y;
    positions[i3 + 2] = z;

    const t = Math.min(r / MAX_RADIUS, 1);
    if (t < 0.5) {
      tempColor.lerpColors(coreColor, midColor, t * 2);
    } else {
      tempColor.lerpColors(midColor, rimColor, (t - 0.5) * 2);
    }

    const brightness = 0.65 + Math.random() * 0.45;
    colors[i3]     = tempColor.r * brightness;
    colors[i3 + 1] = tempColor.g * brightness;
    colors[i3 + 2] = tempColor.b * brightness;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const spriteCanvas = document.createElement('canvas');
  spriteCanvas.width = 64;
  spriteCanvas.height = 64;
  const ctx = spriteCanvas.getContext('2d');
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.35, 'rgba(255,255,255,0.6)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 64, 64);
  const sprite = new THREE.CanvasTexture(spriteCanvas);

  const material = new THREE.PointsMaterial({
    size: 0.22,
    map: sprite,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  const galaxy = new THREE.Points(geometry, material);
  scene.add(galaxy);

  const bgStarCount = 1500;
  const bgGeometry = new THREE.BufferGeometry();
  const bgPositions = new Float32Array(bgStarCount * 3);
  for (let i = 0; i < bgStarCount; i++) {
    const i3 = i * 3;
    const radius = 90 + Math.random() * 80;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    bgPositions[i3]     = radius * Math.sin(phi) * Math.cos(theta);
    bgPositions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    bgPositions[i3 + 2] = radius * Math.cos(phi);
  }
  bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
  const bgMaterial = new THREE.PointsMaterial({
    size: 0.12,
    color: 0xffffff,
    transparent: true,
    opacity: 0.4,
    depthWrite: false
  });
  const bgStars = new THREE.Points(bgGeometry, bgMaterial);
  scene.add(bgStars);

  function animate() {
    requestAnimationFrame(animate);

    galaxy.rotation.y += 0.0008;
    bgStars.rotation.y += 0.00012;

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>

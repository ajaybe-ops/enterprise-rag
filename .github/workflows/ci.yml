name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The corpus manifest is content-addressed and the whole point is that a
        # run is reproducible. If the test suite only passes on one OS, the
        # reproduction claim is false.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: pytest -q

      - name: Generate corpus
        run: python scripts/generate_corpus.py

      - name: Evaluate
        # Non-zero exit on an authorization or preference violation. The gate is
        # on *violations*, not on forbidden sources being retrieved: a
        # superseded document appearing in the candidate set and being correctly
        # outranked is correct behaviour, and gating on it fails passing runs.
        run: |
          python scripts/evaluate.py \
            --corpus evaluation/generated/docs \
            --probes evaluation/generated/probes.json \
            --out runs/baseline.json \
            --save-manifest runs/manifest.json

      - name: Regression gate against committed baseline
        # Fails on a metric regression in the direction that matters, including
        # latency increases and leak increases, which a uniform
        # "did the number go down" comparison cannot see.
        run: |
          python scripts/evaluate.py \
            --corpus evaluation/generated/docs \
            --probes evaluation/generated/probes.json \
            --out runs/ci.json \
            --baseline runs/baseline.json

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-reports-py${{ matrix.python-version }}
          path: runs/
